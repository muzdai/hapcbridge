set_config:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hapcbridge
    config:
      required: true
      example: '{"temperatureUnit": "F", "updateIntervalSeconds": 5}'
      selector:
        object:

command:
  target:
    entity:
      integration: hapcbridge
      domain: switch
  fields:
    command:
      required: true
      example: close_active_window
      selector:
        select:
          translation_key: command
          options:
            - shutdown
            - restart
            - abort_shutdown
            - sleep
            - hibernate
            - lock
            - logoff
            - monitor_off
            - close_active_window

notify:
  target:
    entity:
      integration: hapcbridge
      domain: switch
  fields:
    message:
      required: true
      example: "Стирка закончилась"
      selector:
        text:
          multiline: true
    title:
      example: "Home Assistant"
      selector:
        text:
    actions:
      example: '[{"id": "open", "title": "Открыть"}, {"id": "ignore", "title": "Игнорировать"}]'
      selector:
        object:
    tag:
      example: doorbell
      selector:
        text:
    duration:
      selector:
        select:
          options:
            - short
            - long
    silent:
      selector:
        boolean:
