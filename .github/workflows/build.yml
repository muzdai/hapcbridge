name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version from tag
        id: ver
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0' }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        shell: pwsh
        run: |
          $common = @('-c','Release','-r','win-x64','--self-contained',
                      '-p:PublishSingleFile=true','-p:EnableCompressionInSingleFile=true',
                      '-p:IncludeNativeLibrariesForSelfExtract=true','-p:DebugType=none',
                      "-p:Version=${{ steps.ver.outputs.version }}",'-o','publish')
          dotnet publish src/HaPcBridge.Service @common
          dotnet publish src/HaPcBridge.Agent @common
          Copy-Item config.example.json, README.md publish/
          Compress-Archive -Path publish/* -DestinationPath hapcbridge-win-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hapcbridge-win-x64
          path: hapcbridge-win-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: hapcbridge-win-x64.zip
          generate_release_notes: true
